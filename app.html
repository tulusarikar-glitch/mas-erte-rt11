<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mas eRTe Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1E7; --surface:#FFFFFF; --ink:#20261D; --sub:#5B6353;
  --green:#1F4D3A; --green-light:#3E7A5C; --gold:#B98A2E; --brick:#A24B3E;
  --line:#DCE1D2; --nav-bg:#FFFFFF;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A15; --surface:#1B241D; --ink:#EAEDE4; --sub:#9BA694;
    --green:#4C8A6B; --green-light:#6BAE8B; --gold:#D6AE5C; --brick:#C97A6A;
    --line:#2B362B; --nav-bg:#1B241D;
  }
}
:root[data-theme="dark"]{
  --bg:#121A15; --surface:#1B241D; --ink:#EAEDE4; --sub:#9BA694;
  --green:#4C8A6B; --green-light:#6BAE8B; --gold:#D6AE5C; --brick:#C97A6A;
  --line:#2B362B; --nav-bg:#1B241D;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; min-height:100dvh; background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif; display:flex; justify-content:center;
  padding:24px 12px;
}
.phone{
  width:100%; max-width:420px; background:var(--surface); min-height:calc(100dvh - 48px);
  border-radius:28px; overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 20px 50px rgba(20,30,20,.18); border:1px solid var(--line);
}
header{ background:var(--green); color:#fff; padding:20px 20px 16px; position:sticky; top:0; z-index:5; }
header .brand{font-family:'Fraunces',serif; font-weight:600; font-size:20px; letter-spacing:.2px;}
header .place{font-size:12.5px; opacity:.85; margin-top:2px;}
header .who{display:flex; align-items:center; justify-content:space-between; margin-top:12px; gap:10px;}
header .who .name{font-size:13px; font-weight:600;}
header .who .role{font-size:11px; opacity:.85;}
header .logout{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); color:#fff; font-size:11.5px; font-weight:600; padding:6px 10px; border-radius:8px; cursor:pointer; font-family:inherit;}
main{flex:1; overflow-y:auto; padding:18px 16px 90px;}
h2.title{font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin:2px 0 14px; color:var(--ink);}
.card{ background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px; }
.card + .card{margin-top:10px;}
.row{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
.label{font-size:12.5px; color:var(--sub);}
.value-lg{font-family:'Fraunces',serif; font-size:26px; font-weight:600; margin-top:2px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
.stat .n{font-family:'Fraunces',serif; font-size:22px; font-weight:600;}
.stat .l{font-size:12px; color:var(--sub); margin-top:2px;}
.item{padding:11px 0; border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:none;}
.item-title{font-weight:600; font-size:14.5px;}
.item-sub{font-size:12.5px; color:var(--sub); margin-top:2px; line-height:1.5;}
.badge{display:inline-block; font-size:11px; padding:3px 9px; border-radius:99px; font-weight:600;}
.badge.ok{background:#DCEBE0; color:var(--green);}
.badge.wait{background:#F3E6C9; color:#8A6417;}
.badge.due{background:#F3DCD8; color:var(--brick);}
@media (prefers-color-scheme: dark){
  .badge.ok{background:#1E3A2A;} .badge.wait{background:#3B3116;} .badge.due{background:#3C2521;}
}
.btn{ display:inline-block; background:var(--green); color:#fff; border:none; padding:10px 16px; border-radius:11px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; }
.btn.outline{background:transparent; color:var(--green); border:1px solid var(--green);}
.btn.gold{background:var(--gold);}
.btn.brick{background:var(--brick);}
.btn.block{width:100%; text-align:center;}
.btn.sm{padding:6px 10px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:.6; cursor:default;}
.btn-row{display:flex; gap:8px; margin-top:10px;}
.list-link{ display:flex; justify-content:space-between; align-items:center; padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer; background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left; font-family:inherit; color:var(--ink); }
.list-link:last-child{border-bottom:none;}
.list-link .ico{font-size:19px; margin-right:12px;}
.list-link .txt{flex:1;}
.list-link .name{font-weight:600; font-size:14.5px;}
.list-link .desc{font-size:12px; color:var(--sub); margin-top:1px;}
.list-link .chev{color:var(--sub); font-size:16px;}
.back{ background:none; border:none; color:var(--ink); font-size:14px; font-weight:600; cursor:pointer; padding:0 0 14px; display:flex; align-items:center; gap:6px; font-family:inherit; }
.section-tag{font-size:11.5px; color:var(--green-light); font-weight:700; margin-bottom:4px;}
nav{ position:sticky; bottom:0; background:var(--nav-bg); border-top:1px solid var(--line); display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px)); }
nav button{ flex:1; background:none; border:none; font-family:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; color:var(--sub); font-size:11px; font-weight:600; }
nav button.active{color:var(--green);}
nav button .ic{font-size:19px;}
.empty{text-align:center; padding:30px 10px; color:var(--sub); font-size:13.5px;}
.locked{opacity:.55;}
.scan-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.scan-btn{background:var(--green-light); color:#fff; border:none; border-radius:9px; padding:7px 12px; font-size:12px; font-weight:600; font-family:inherit; cursor:pointer;}
.geo{font-size:11px; color:var(--sub); margin-top:2px;}
/* form & login */
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--sub); margin-bottom:4px;}
.field label .opt{font-weight:400; font-style:italic; color:var(--sub);}
.field input, .field select{ width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:inherit; font-size:13.5px; }
.field input:focus, .field select:focus{outline:2px solid var(--green-light);}
.err{background:#F3DCD8; color:var(--brick); border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; font-weight:600;}
.msg-ok{background:#DCEBE0; color:var(--green); border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; font-weight:600;}
.login-wrap{min-height:calc(100dvh - 48px); display:flex; flex-direction:column; justify-content:center; padding:28px 26px;}
.login-brand{font-family:'Fraunces',serif; font-weight:700; font-size:26px; color:var(--green); margin-bottom:2px;}
.login-place{font-size:12.5px; color:var(--sub); margin-bottom:22px;}
.tabs2{display:flex; gap:6px; margin-bottom:18px; background:var(--bg); padding:4px; border-radius:12px;}
.tabs2 button{flex:1; padding:8px; border-radius:9px; border:none; background:none; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--sub); cursor:pointer;}
.tabs2 button.active{background:var(--surface); color:var(--green); box-shadow:0 1px 3px rgba(0,0,0,.08);}
.mask-note{font-size:11px; color:var(--sub); margin-top:2px;}
</style>
</head>
<body>
<div class="phone" id="phone"></div>

<script>
/* ====================== KONFIGURASI ====================== */
const API_URL = "https://script.google.com/macros/s/AKfycbwp520IuPJE_K9XwIueQpw4w5756FWGEsdxqRubYIoAAR5NudNqX9zieLOmLzYHyD7IUg/exec";
const API_KEY = "gampangwae"; // harus SAMA dengan API_KEY di Code.gs

/* ====================== HELPER API ====================== */
async function apiGet(action, params) {
  const aktor = (session && session.username) || "";
  const q = new URLSearchParams(Object.assign({ action, apiKey: API_KEY, aktor }, params || {}));
  const res = await fetch(API_URL + "?" + q.toString());
  return res.json();
}
async function apiPost(action, body) {
  const aktor = (session && session.username) || "";
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action, apiKey: API_KEY, aktor }, body || {}))
  });
  return res.json();
}
const rupiah = n => "Rp " + (Number(n) || 0).toLocaleString("id-ID");
function fmtTanggal(v) {
  if (!v) return "-";
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  return d.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
}
const badge = s => s === "ok" ? '<span class="badge ok">Lunas / Selesai</span>'
                 : s === "wait" ? '<span class="badge wait">Diproses</span>'
                 : '<span class="badge due">Belum Bayar</span>';
function maskNik(nik) {
  nik = String(nik || "");
  if (nik.length < 8) return "****";
  return nik.slice(0, 4) + "xx****xx" + nik.slice(-2);
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

/* ====================== SESI ====================== */
let session = null;
try { const raw = localStorage.getItem("masrte_session"); if (raw) session = JSON.parse(raw); } catch (e) {}
function saveSession(s) { session = s; try { localStorage.setItem("masrte_session", JSON.stringify(s)); } catch (e) {} }
function clearSession() { session = null; try { localStorage.removeItem("masrte_session"); } catch (e) {} }

const can = {
  editWarga: () => session && (session.peran === "ketua" || session.peran === "sekretaris"),
  seeFullNik: (no_kk) => session && (session.peran === "ketua" || session.peran === "sekretaris" || (session.peran === "warga" && session.no_kk === no_kk)),
  editKasRT: () => session && (session.peran === "ketua" || session.peran === "bendahara"),
  editKasJimpitan: () => session && (session.peran === "ketua" || session.peran === "kt_bendahara"),
  editKasGerabah: () => session && (session.peran === "ketua" || session.peran === "bendahara"),
  manageUsers: () => session && session.peran === "admin",
  scanJimpitan: () => session && (session.peran === "kt_petugas" || session.peran === "kt_ketua"),
  isAdmin: () => session && session.peran === "admin",
  isWarga: () => session && session.peran === "warga",
  managePengumuman: () => session && (session.peran === "ketua" || session.peran === "sekretaris"),
  processSurat: () => session && (session.peran === "ketua" || session.peran === "sekretaris"),
  finalizeSurat: () => session && session.peran === "ketua",
  processPengaduan: () => session && (session.peran === "ketua" || session.peran === "sekretaris"),
  manageKT: () => session && (session.peran === "ketua" || session.peran === "kt_ketua"),
  viewKasJimpitan: () => session && (session.peran === "ketua" || session.peran === "kt_ketua" || session.peran === "kt_bendahara"),
  manageKontak: () => session && (session.peran === "ketua" || session.peran === "sekretaris"),
  manageIuranRT: () => session && (session.peran === "ketua" || session.peran === "bendahara"),
  hapusPertemuanRT: () => session && session.peran === "ketua",
  inputJimpitan: () => session && (session.peran === "ketua" || session.peran === "kt_ketua" || session.peran === "kt_petugas"),
  postJimpitan: () => session && (session.peran === "ketua" || session.peran === "kt_bendahara"),
  manageInventaris: () => session && (session.peran === "ketua" || session.peran === "sekretaris"),
  manageRumah: () => session && (session.peran === "ketua" || session.peran === "sekretaris" || session.peran === "kt_ketua" || session.peran === "kt_bendahara"),
};
// alias supaya kode lama yang memanggil can.editKas() tetap berfungsi (Kas RT)
can.editKas = can.editKasRT;
const ROLE_LABEL = { ketua: "Ketua RT", sekretaris: "Sekretaris RT", bendahara: "Bendahara RT",
  kt_ketua: "Ketua Karang Taruna", kt_bendahara: "Bendahara Karang Taruna", kt_petugas: "Petugas Jimpitan",
  admin: "Admin", warga: "Warga" };

/* ====================== DATA TETAP (belum ada di struktur Sheet spesifikasi) ====================== */
const STATIS = {
  surat_jenis:["Surat Pengantar KTP/KK","Surat Keterangan Domisili","Surat Keterangan Tidak Mampu","Surat Pengantar Nikah","Surat Keterangan Kematian"],
};
function statusBadge(s) {
  s = String(s || "").toLowerCase();
  if (s === "selesai" || s === "lunas") return '<span class="badge ok">' + esc(s.charAt(0).toUpperCase()+s.slice(1)) + '</span>';
  if (s === "diproses") return '<span class="badge wait">Diproses</span>';
  return '<span class="badge due">' + esc(s || "Diajukan") + '</span>';
}
function waLink(text) { return "https://wa.me/?text=" + encodeURIComponent(text); }

/* ====================== STATE APLIKASI ====================== */
let currentTab = "beranda";
let cache = {
  kk: [], kas: { mutasi: [], saldo: 0 }, totalKK: 0, totalJiwa: 0, users: [],
  pengumuman: [], surat: [], pengaduan: [], kt: [], kontak: [],
  kasJimpitan: { mutasi: [], saldo: 0 }, kasGerabah: { mutasi: [], saldo: 0 },
  pertemuan: [], iuran: [], rumah: [], jimpitanLog: [], jimpitanTotalBelum: 0,
  tunggakan: [], tunggakanTotal: 0, inventaris: []
};
let loginMode = "pengurus";
let formError = "";
let kkRowSeq = 0;

function render() {
  const el = document.getElementById("phone");
  el.innerHTML = session ? appShell() : loginScreen();
  attachEvents();
}

/* ====================== LOGIN ====================== */
function loginScreen() {
  return `
    <div class="login-wrap">
      <div class="login-brand">Mas eRTe Mobile</div>
      <div class="login-place">Dukuh Tulusari · RT 11 · Karangwaru, Plupuh</div>
      <div class="tabs2">
        <button data-mode="pengurus" class="${loginMode==='pengurus'?'active':''}">Pengurus &amp; Petugas</button>
        <button data-mode="warga" class="${loginMode==='warga'?'active':''}">Warga</button>
      </div>
      ${formError ? `<div class="err">${esc(formError)}</div>` : ""}
      ${loginMode === "pengurus" ? `
        <div class="field"><label>Username</label><input id="fUsername" autocomplete="username"></div>
        <div class="field"><label>Password</label><input id="fPassword" type="password" autocomplete="current-password"></div>
        <button class="btn block" id="btnLoginPengurus">Masuk</button>
      ` : `
        <div class="field"><label>Nama lengkap (sesuai Data Warga)</label><input id="fNama"></div>
        <div class="field"><label>NIK</label><input id="fNik" inputmode="numeric"></div>
        <button class="btn gold block" id="btnLoginWarga">Masuk sebagai Warga</button>
      `}
    </div>`;
}

/* ====================== SHELL SETELAH LOGIN ====================== */
function appShell() {
  const header = `
    <header>
      <div class="brand">Mas eRTe Mobile</div>
      <div class="place">Dukuh Tulusari · RT 11 · Karangwaru, Plupuh</div>
      <div class="who">
        <div><div class="name">${esc(session.nama)}</div><div class="role">${esc(ROLE_LABEL[session.peran] || session.peran)}</div></div>
        <button class="logout" id="btnLogout">Keluar</button>
      </div>
    </header>`;
  if (can.isAdmin()) {
    // Sesuai spesifikasi: Admin hanya mengelola akun, tidak melihat modul data lain.
    return `${header}
      <main id="screen">Memuat…</main>
      <nav id="navbar">
        <button data-tab="akun" class="active"><span class="ic">🔐</span>Kelola Akun</button>
      </nav>`;
  }
  return `${header}
    <main id="screen">Memuat…</main>
    <nav id="navbar">
      <button data-tab="beranda" class="${currentTab==='beranda'?'active':''}"><span class="ic">🏠</span>Beranda</button>
      <button data-tab="warga" class="${currentTab==='warga'?'active':''}"><span class="ic">👪</span>Warga</button>
      <button data-tab="kas" class="${currentTab==='kas'?'active':''}"><span class="ic">💰</span>Kas</button>
      <button data-tab="info" class="${currentTab==='info'?'active':''}"><span class="ic">📣</span>Info</button>
      <button data-tab="lainnya" class="${['lainnya','surat','pengaduan','kt','kontak','jimpitan','akun','iuranrt','iuranrtDetail','tunggakan','inventaris','rumah'].includes(currentTab)?'active':''}"><span class="ic">☰</span>Lainnya</button>
    </nav>`;
}

function setScreen(html) { const s = document.getElementById("screen"); if (s) s.innerHTML = html; }

/* ====================== NAVIGASI ====================== */
async function goTab(tab) {
  currentTab = tab;
  render();
  await loadAndShow(tab);
}
async function loadAndShow(tab) {
  setScreen('<div class="empty">Memuat…</div>');
  try {
    if (tab === "beranda") { await Promise.all([refreshBeranda(), refreshInfo()]); setScreen(screens.beranda()); }
    else if (tab === "warga") { await refreshWarga(); setScreen(screens.warga()); }
    else if (tab === "kas") { await refreshKas(); setScreen(screens.kas()); }
    else if (tab === "info") { await refreshInfo(); setScreen(screens.info()); }
    else if (tab === "lainnya") setScreen(screens.lainnya());
    else if (tab === "akun") { await refreshUsers(); setScreen(screens.akun()); }
    else if (tab === "surat") { await refreshSurat(); setScreen(screens.surat()); }
    else if (tab === "pengaduan") { await refreshPengaduan(); setScreen(screens.pengaduan()); }
    else if (tab === "kt") { await refreshKT(); setScreen(screens.kt()); }
    else if (tab === "kontak") { await refreshKontak(); setScreen(screens.kontak()); }
    else if (tab === "iuranrt") { await refreshPertemuanRT(); setScreen(screens.iuranrt()); }
    else if (tab === "jimpitan") { await refreshJimpitanLog(); setScreen(screens.jimpitan()); }
    else if (tab === "tunggakan") { await refreshTunggakanRT(); setScreen(screens.tunggakan()); }
    else if (tab === "inventaris") { await refreshInventaris(); setScreen(screens.inventaris()); }
    else if (tab === "rumah") { await refreshWarga(); setScreen(screens.rumah()); }
    else if (screens[tab]) setScreen(screens[tab]());
  } catch (err) {
    setScreen(`<div class="err">Gagal memuat data: ${esc(err.message)}</div>`);
  }
  attachEvents();
}
async function refreshBeranda() {
  const [w, k] = await Promise.all([apiGet("getWargaKK"), apiGet("getKas", { jenis_kas: "rt" })]);
  if (w.ok) { cache.totalKK = w.total_kk; cache.totalJiwa = w.total_jiwa; }
  if (k.ok) { cache.kas = k; }
}
async function refreshWarga() {
  const [w] = await Promise.all([apiGet("getWargaKK"), refreshRumah()]);
  if (!w.ok) throw new Error(w.error);
  cache.kk = w.kk; cache.totalKK = w.total_kk; cache.totalJiwa = w.total_jiwa;
}
async function refreshKas() {
  const jobs = [apiGet("getKas", { jenis_kas: "rt" }), apiGet("getKas", { jenis_kas: "gerabah" })];
  const [rt, gerabah] = await Promise.all(jobs);
  if (!rt.ok) throw new Error(rt.error);
  cache.kas = rt;
  if (gerabah.ok) cache.kasGerabah = gerabah;
  if (can.viewKasJimpitan()) {
    const j = await apiGet("getKas", { jenis_kas: "jimpitan" });
    if (j.ok) cache.kasJimpitan = j;
  }
}
async function refreshUsers() {
  const u = await apiGet("getUsers");
  if (!u.ok) throw new Error(u.error);
  cache.users = u.users;
}
async function refreshInfo() {
  const r = await apiGet("getPengumuman");
  if (r.ok) cache.pengumuman = r.pengumuman;
}
async function refreshSurat() {
  const params = can.isWarga() ? { nik: session.nik } : {};
  const r = await apiGet("getSurat", params);
  if (!r.ok) throw new Error(r.error);
  cache.surat = r.surat;
}
async function refreshPengaduan() {
  const params = can.isWarga() ? { nik: session.nik } : {};
  const r = await apiGet("getPengaduan", params);
  if (!r.ok) throw new Error(r.error);
  cache.pengaduan = r.pengaduan;
}
async function refreshKT() {
  const r = await apiGet("getKarangTaruna");
  if (!r.ok) throw new Error(r.error);
  cache.kt = r.anggota;
}
async function refreshKontak() {
  const r = await apiGet("getKontak");
  if (!r.ok) throw new Error(r.error);
  cache.kontak = r.kontak;
}
async function refreshPertemuanRT() {
  const r = await apiGet("getPertemuanRT");
  if (!r.ok) throw new Error(r.error);
  cache.pertemuan = r.pertemuan;
}
async function refreshIuranRT(pertemuan_id) {
  const r = await apiGet("getIuranRT", { pertemuan_id });
  if (!r.ok) throw new Error(r.error);
  cache.iuran = r.iuran;
}
async function refreshTunggakanRT() {
  const r = await apiGet("getTunggakanRT");
  if (!r.ok) throw new Error(r.error);
  cache.tunggakan = r.tunggakan; cache.tunggakanTotal = r.grand_total;
}
async function refreshInventaris() {
  const r = await apiGet("getInventaris");
  if (!r.ok) throw new Error(r.error);
  cache.inventaris = r.inventaris;
}
async function refreshRumah() {
  const r = await apiGet("getRumah");
  if (r.ok) cache.rumah = r.rumah;
}
async function refreshJimpitanLog() {
  const jobs = [apiGet("getJimpitanLog"), refreshRumah()];
  const [r] = await Promise.all(jobs);

// Render <select> pilihan rumah + input nama untuk "rumah baru", dipakai di kkForm & jimpitanForm.
function rumahSelectField(selectedId) {
  const opsi = cache.rumah.map(r => `<option value="${esc(r.id)}" ${selectedId===r.id?'selected':''}>${esc(r.nama)} (${r.jumlah_kk} KK)</option>`).join("");
  return `
    <div class="field"><label>Rumah <span class="opt">(opsional, bisa dilengkapi nanti)</span></label>
      <select id="fRumahPilih">
        <option value="">— belum ditautkan —</option>
        ${opsi}
        <option value="__baru__">+ Buat rumah baru…</option>
      </select>
    </div>
    <div id="fRumahBaruWrap" style="display:none">
      <div class="field"><label>Nama/patokan rumah baru</label><input id="fRumahBaruNama" placeholder="Rumah Bu Sri, sebelah masjid"></div>
    </div>`;
}
function bindRumahSelect() {
  const sel = document.getElementById("fRumahPilih");
  const wrap = document.getElementById("fRumahBaruWrap");
  if (!sel || !wrap) return;
  sel.addEventListener("change", () => { wrap.style.display = sel.value === "__baru__" ? "block" : "none"; });
}
// Ambil id_rumah dari form (fRumahPilih + fRumahBaruNama kalau perlu buat baru dulu).
async function resolveRumahFromForm() {
  const sel = document.getElementById("fRumahPilih");
  if (!sel) return { ok: true, id_rumah: "" };
  if (sel.value === "__baru__") {
    const nama = (document.getElementById("fRumahBaruNama").value || "").trim();
    if (!nama) return { ok: false, error: "Nama rumah baru wajib diisi." };
    const r = await apiPost("addRumah", { nama });
    if (!r.ok) return { ok: false, error: r.error };
    await refreshRumah();
    return { ok: true, id_rumah: r.id };
  }
  return { ok: true, id_rumah: sel.value || "" };
}

/* ---- warga ---- */
async function openKK(no_kk) {
  currentTab = "warga";
  setScreen(screens.kkDetail(no_kk));
  attachEvents();
  const r = await apiGet("getAnggota", { no_kk });
  const wrap = document.getElementById("kkAnggotaWrap");
  if (!wrap) return;
  if (!r.ok) { wrap.innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  const list = r.anggota;
  wrap.innerHTML = list.length ? list.map(a => `
    <div class="item">
      <div class="row"><span class="item-title">${esc(a.nama)}</span><span class="item-sub">${esc(a.status_hubungan||'-')}</span></div>
      <div class="item-sub">NIK ${esc(can.seeFullNik(no_kk) ? a.nik : maskNik(a.nik))} ${a.jenis_kelamin?('· '+esc(a.jenis_kelamin)):''} ${a.pekerjaan?('· '+esc(a.pekerjaan)):''}</div>
      ${can.editWarga() ? `<div class="btn-row"><button class="btn outline sm" data-edit-anggota="${esc(a.nik)}">Ubah</button><button class="btn brick sm" data-del-anggota="${esc(a.nik)}">Hapus</button></div>` : ""}
    </div>`).join("") : '<div class="empty">Belum ada anggota di KK ini.</div>';
  Array.from(wrap.querySelectorAll("[data-edit-anggota]")).forEach(b => b.addEventListener("click", () => {
    const a = list.find(x => String(x.nik) === b.dataset.editAnggota);
    formError = ""; setScreen(anggotaForm(no_kk, a)); attachEvents();
  }));
  Array.from(wrap.querySelectorAll("[data-del-anggota]")).forEach(b => b.addEventListener("click", () => delAnggota(no_kk, b.dataset.delAnggota)));
}
async function submitKK() {
  const no_kk = document.getElementById("fNoKK").value.trim();
  const rows = Array.from(document.querySelectorAll(".kk-anggota-row")).map(row => ({
    nama: row.querySelector(".fRowNama").value.trim(),
    nik: row.querySelector(".fRowNik").value.trim(),
    status_hubungan: row.querySelector(".fRowHubungan").value.trim()
  }));
  const first = rows[0] || {};
  const extra = rows.slice(1).filter(a => a.nama || a.nik);
  if (!no_kk) { formError = "No. KK wajib diisi."; setScreen(kkForm()); attachEvents(); return; }
  if (!first.nama || !first.nik) { formError = "Nama dan NIK anggota pertama (Kepala Keluarga) wajib diisi."; setScreen(kkForm()); attachEvents(); return; }
  const invalidExtra = extra.find(a => !a.nama || !a.nik);
  if (invalidExtra) { formError = "Lengkapi Nama dan NIK untuk setiap anggota tambahan, atau hapus barisnya jika tidak dipakai."; setScreen(kkForm()); attachEvents(); return; }
  const rr0 = await resolveRumahFromForm();
  if (!rr0.ok) { formError = rr0.error; setScreen(kkForm()); attachEvents(); return; }

  const btn = document.getElementById("btnSimpanKK"); btn.disabled = true; btn.textContent = "Menyimpan…";
  const r = await apiPost("addAnggota", { no_kk, id_rumah: rr0.id_rumah, nama: first.nama, nik: first.nik, status_hubungan: first.status_hubungan });
  if (!r.ok) { formError = r.error; setScreen(kkForm()); attachEvents(); return; }

  const warnings = [];
  for (const a of extra) {
    const rr = await apiPost("addAnggota", { no_kk, nama: a.nama, nik: a.nik, status_hubungan: a.status_hubungan });
    if (!rr.ok) warnings.push(`${a.nama} (${a.nik}): ${rr.error}`);
  }
  formError = "";
  await refreshWarga();
  openKK(no_kk);
  if (warnings.length) alert("KK tersimpan, tapi ada anggota yang gagal ditambahkan:\n" + warnings.join("\n") + "\nSilakan tambahkan manual lewat tombol \"+ Tambah anggota\" di halaman KK.");
}
async function submitAnggota() {
  const btn = document.getElementById("btnSimpanAnggota");
  const no_kk = btn.dataset.noKk, existing = btn.dataset.existing === "1";
  const payload = {
    no_kk, nama: document.getElementById("fNama").value.trim(), nik: document.getElementById("fNik").value.trim(),
    jenis_kelamin: document.getElementById("fJk").value, ttl: document.getElementById("fTtl").value.trim(),
    agama: document.getElementById("fAgama").value.trim(), pendidikan: document.getElementById("fPendidikan").value.trim(),
    pekerjaan: document.getElementById("fPekerjaan").value.trim(), status_kawin: document.getElementById("fKawin").value.trim(),
    status_hubungan: document.getElementById("fHubungan").value.trim(), nama_ayah: document.getElementById("fAyah").value.trim(),
    nama_ibu: document.getElementById("fIbu").value.trim()
  };
  if (!payload.nama || !payload.nik) { formError = "Nama dan NIK wajib diisi."; setScreen(anggotaForm(no_kk, existing ? payload : null)); attachEvents(); return; }
  btn.disabled = true; btn.textContent = "Menyimpan…";
  const r = await apiPost(existing ? "updateAnggota" : "addAnggota", payload);
  if (!r.ok) { formError = r.error; setScreen(anggotaForm(no_kk, existing ? payload : null)); attachEvents(); return; }

/* ---- rumah ---- */
async function submitRumah() {
  const btn = document.getElementById("btnSimpanRumah");
  const id = btn.dataset.id;
  const payload = { nama: document.getElementById("fNamaRumah").value.trim(), catatan: document.getElementById("fCatatanRumah").value.trim() };
  const checkedKK = Array.from(document.querySelectorAll(".rumah-kk-check:checked")).map(c => c.value);
  if (!payload.nama) { formError = "Nama rumah wajib diisi."; setScreen(rumahForm(id ? { id, ...payload } : null)); attachEvents(); return; }
  if (id) payload.id = id;
  btn.disabled = true; btn.textContent = "Menyimpan…";
  const r = await apiPost(id ? "updateRumah" : "addRumah", payload);
  if (!r.ok) { formError = r.error; setScreen(rumahForm(id ? payload : null)); attachEvents(); return; }
  const rumahId = id || r.id;
  // Tautkan semua KK yang dicentang ke rumah ini.
  for (const no_kk of checkedKK) {
    await apiPost("setRumahKK", { no_kk, id_rumah: rumahId });
  }
  // Lepas tautan KK yang sebelumnya di rumah ini tapi sekarang dilepas centangnya (saat mengubah rumah).
  if (id) {
    const toUnlink = cache.kk.filter(k => String(k.id_rumah||"") === String(id) && checkedKK.indexOf(String(k.no_kk)) === -1);
    for (const k of toUnlink) {
      await apiPost("setRumahKK", { no_kk: k.no_kk, id_rumah: "" });
    }
  }
  formError = "";
  currentTab = "rumah";
  await refreshWarga(); setScreen(screens.rumah()); attachEvents();
}
async function delRumah(id) {
  if (!confirm("Hapus data rumah ini? Hanya bisa dihapus kalau tidak ada KK yang masih tertaut.")) return;
  const r = await apiPost("deleteRumah", { id });
  if (!r.ok) { alert(r.error); return; }
  await refreshRumah(); setScreen(screens.rumah()); attachEvents();
}

  if (!r.ok) { alert(r.error); return; }

  await refreshWarga();
  openKK(no_kk);
}

async function submitJimpitan() {

  const catatan = document.getElementById("fCatatan").value.trim();

  const selVal = document.getElementById("fRumahPilih").value;
  if (!selVal) { formError = "Rumah wajib dipilih."; setScreen(jimpitanForm()); attachEvents(); return; }
  const rr = await resolveRumahFromForm();
  if (!rr.ok) { formError = rr.error; setScreen(jimpitanForm()); attachEvents(); return; }
  if (!rr.id_rumah) { formError = "Rumah wajib dipilih."; setScreen(jimpitanForm()); attachEvents(); return; }
  const payload = { tanggal, id_rumah: rr.id_rumah, jumlah, catatan };
  btn.disabled = true; btn.textContent = "Menyimpan…";
  const r = await apiPost("addJimpitanLog", payload);
  if (!r.ok) { formError = r.error; setScreen(jimpitanForm()); attachEvents(); return; }

  currentTab = "jimpitan";
  await refreshJimpitanLog(); setScreen(screens.jimpitan()); attachEvents();

}
async function postingJimpitan() {
  const ids = Array.from(document.querySelectorAll(".jimpitan-check:checked")).map(c => c.value);
  if (!ids.length) { alert("Pilih minimal satu log jimpitan untuk diposting."); return; }
  if (!confirm("Posting " + ids.length + " log terpilih sebagai 1 mutasi masuk ke Kas Jimpitan? Setelah diposting, log ini tidak bisa diubah/dihapus lagi.")) return;
  const r = await apiPost("postJimpitanLog", { ids });
  if (!r.ok) { alert(r.error); return; }
  await refreshJimpitanLog(); setScreen(screens.jimpitan()); attachEvents();
  alert(r.message);
}

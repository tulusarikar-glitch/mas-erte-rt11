<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mas eRTe Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1E7; --surface:#FFFFFF; --ink:#20261D; --sub:#5B6353;
  --green:#1F4D3A; --green-light:#3E7A5C; --gold:#B98A2E; --brick:#A24B3E;
  --line:#DCE1D2; --nav-bg:#FFFFFF;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A15; --surface:#1B241D; --ink:#EAEDE4; --sub:#9BA694;
    --green:#4C8A6B; --green-light:#6BAE8B; --gold:#D6AE5C; --brick:#C97A6A;
    --line:#2B362B; --nav-bg:#1B241D;
  }
}
:root[data-theme="dark"]{
  --bg:#121A15; --surface:#1B241D; --ink:#EAEDE4; --sub:#9BA694;
  --green:#4C8A6B; --green-light:#6BAE8B; --gold:#D6AE5C; --brick:#C97A6A;
  --line:#2B362B; --nav-bg:#1B241D;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; min-height:100dvh; background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif; display:flex; justify-content:center;
  padding:24px 12px;
}
.phone{
  width:100%; max-width:420px; background:var(--surface); min-height:calc(100dvh - 48px);
  border-radius:28px; overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 20px 50px rgba(20,30,20,.18); border:1px solid var(--line);
}
header{ background:var(--green); color:#fff; padding:20px 20px 16px; position:sticky; top:0; z-index:5; }
header .brand{font-family:'Fraunces',serif; font-weight:600; font-size:20px; letter-spacing:.2px;}
header .place{font-size:12.5px; opacity:.85; margin-top:2px;}
header .who{display:flex; align-items:center; justify-content:space-between; margin-top:12px; gap:10px;}
header .who .name{font-size:13px; font-weight:600;}
header .who .role{font-size:11px; opacity:.85;}
header .logout{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); color:#fff; font-size:11.5px; font-weight:600; padding:6px 10px; border-radius:8px; cursor:pointer; font-family:inherit;}
main{flex:1; overflow-y:auto; padding:18px 16px 90px;}
h2.title{font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin:2px 0 14px; color:var(--ink);}
.card{ background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px; }
.card + .card{margin-top:10px;}
.row{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
.label{font-size:12.5px; color:var(--sub);}
.value-lg{font-family:'Fraunces',serif; font-size:26px; font-weight:600; margin-top:2px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
.stat .n{font-family:'Fraunces',serif; font-size:22px; font-weight:600;}
.stat .l{font-size:12px; color:var(--sub); margin-top:2px;}
.item{padding:11px 0; border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:none;}
.item-title{font-weight:600; font-size:14.5px;}
.item-sub{font-size:12.5px; color:var(--sub); margin-top:2px; line-height:1.5;}
.badge{display:inline-block; font-size:11px; padding:3px 9px; border-radius:99px; font-weight:600;}
.badge.ok{background:#DCEBE0; color:var(--green);}
.badge.wait{background:#F3E6C9; color:#8A6417;}
.badge.due{background:#F3DCD8; color:var(--brick);}
@media (prefers-color-scheme: dark){
  .badge.ok{background:#1E3A2A;} .badge.wait{background:#3B3116;} .badge.due{background:#3C2521;}
}
.btn{ display:inline-block; background:var(--green); color:#fff; border:none; padding:10px 16px; border-radius:11px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; }
.btn.outline{background:transparent; color:var(--green); border:1px solid var(--green);}
.btn.gold{background:var(--gold);}
.btn.brick{background:var(--brick);}
.btn.block{width:100%; text-align:center;}
.btn.sm{padding:6px 10px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:.6; cursor:default;}
.btn-row{display:flex; gap:8px; margin-top:10px;}
.list-link{ display:flex; justify-content:space-between; align-items:center; padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer; background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left; font-family:inherit; color:var(--ink); }
.list-link:last-child{border-bottom:none;}
.list-link .ico{font-size:19px; margin-right:12px;}
.list-link .txt{flex:1;}
.list-link .name{font-weight:600; font-size:14.5px;}
.list-link .desc{font-size:12px; color:var(--sub); margin-top:1px;}
.list-link .chev{color:var(--sub); font-size:16px;}
.back{ background:none; border:none; color:var(--ink); font-size:14px; font-weight:600; cursor:pointer; padding:0 0 14px; display:flex; align-items:center; gap:6px; font-family:inherit; }
.section-tag{font-size:11.5px; color:var(--green-light); font-weight:700; margin-bottom:4px;}
nav{ position:sticky; bottom:0; background:var(--nav-bg); border-top:1px solid var(--line); display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px)); }
nav button{ flex:1; background:none; border:none; font-family:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; color:var(--sub); font-size:11px; font-weight:600; }
nav button.active{color:var(--green);}
nav button .ic{font-size:19px;}
.empty{text-align:center; padding:30px 10px; color:var(--sub); font-size:13.5px;}
.locked{opacity:.55;}
.scan-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.scan-btn{background:var(--green-light); color:#fff; border:none; border-radius:9px; padding:7px 12px; font-size:12px; font-weight:600; font-family:inherit; cursor:pointer;}
.geo{font-size:11px; color:var(--sub); margin-top:2px;}
/* form & login */
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--sub); margin-bottom:4px;}
.field label .opt{font-weight:400; font-style:italic; color:var(--sub);}
.field input, .field select{ width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:inherit; font-size:13.5px; }
.field input:focus, .field select:focus{outline:2px solid var(--green-light);}
.err{background:#F3DCD8; color:var(--brick); border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; font-weight:600;}
.msg-ok{background:#DCEBE0; color:var(--green); border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; font-weight:600;}
.login-wrap{min-height:calc(100dvh - 48px); display:flex; flex-direction:column; justify-content:center; padding:28px 26px;}
.login-brand{font-family:'Fraunces',serif; font-weight:700; font-size:26px; color:var(--green); margin-bottom:2px;}
.login-place{font-size:12.5px; color:var(--sub); margin-bottom:22px;}
.tabs2{display:flex; gap:6px; margin-bottom:18px; background:var(--bg); padding:4px; border-radius:12px;}
.tabs2 button{flex:1; padding:8px; border-radius:9px; border:none; background:none; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--sub); cursor:pointer;}
.tabs2 button.active{background:var(--surface); color:var(--green); box-shadow:0 1px 3px rgba(0,0,0,.08);}
.mask-note{font-size:11px; color:var(--sub); margin-top:2px;}

.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:8px;}
.cal .h{font-size:10px; text-align:center; color:var(--sub); font-weight:600;}
.cal .d{aspect-ratio:1; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; background:var(--bg); color:var(--sub); border:1px solid var(--line);}
.cal .d b{font-size:12px; color:var(--ink);}
.cal .d.lunas{background:#DCEBE0; color:var(--green); border-color:transparent;}
.cal .d.kurang{background:#F3E6C9; color:#8A6417; border-color:transparent;}
.cal .d.kosong{background:#F3DCD8; color:var(--brick); border-color:transparent;}
.cal .d.empty0{visibility:hidden;}
.month-nav{display:flex; gap:8px; align-items:center; margin:12px 0;}
.month-nav input{flex:1; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:inherit;}
</style>
</head>
<body>
<div class="phone" id="phone"></div>

<script>
/* ====================== KONFIGURASI ====================== */
const API_URL = "https://script.google.com/macros/s/AKfycbwp520IuPJE_K9XwIueQpw4w5756FWGEsdxqRubYIoAAR5NudNqX9zieLOmLzYHyD7IUg/exec";
const API_KEY = "gampangwae"; // harus SAMA dengan API_KEY di Code.gs

/* ====================== HELPER API ====================== */
async function apiGet(action, params) {
  const aktor = (session && session.username) || "";
  const q = new URLSearchParams(Object.assign({ action, apiKey: API_KEY, aktor }, params || {}));
  const res = await fetch(API_URL + "?" + q.toString());
  return res.json();
}
async function apiPost(action, body) {
  const aktor = (session && session.username) || "";
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action, apiKey: API_KEY, aktor }, body || {}))
  });
  return res.json();
}
const rupiah = n => "Rp " + (Number(n) || 0).toLocaleString("id-ID");
function fmtTanggal(v) {
  if (!v) return "-";
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  return d.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
}
const badge = s => s === "ok" ? '<span class="badge ok">Lunas / Selesai</span>'
                 : s === "wait" ? '<span class="badge wait">Diproses</span>'
                 : '<span class="badge due">Belum Bayar</span>';
function maskNik(nik) {
  nik = String(nik || "");
  if (nik.length < 8) return "****";
  return nik.slice(0, 4) + "xx****xx" + nik.slice(-2);
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

/* ====================== SESI ====================== */
let session = null;
try { const raw = localStorage.getItem("masrte_session"); if (raw) session = JSON.parse(raw); } catch (e) {}
function saveSession(s) { session = s; try { localStorage.setItem("masrte_session", JSON.stringify(s)); } catch (e) {} }
function clearSession() { session = null; try { localStorage.removeItem("masrte_session"); } catch (e) {} }

const can = {
  editWarga: () => session && (session.peran === "ketua" || session.peran === "sekretaris"),
  seeFullNik: (no_kk) => session && (session.peran === "ketua" || session.peran === "sekretaris" || (session.peran === "warga" && session.no_kk === no_kk)),
  editKasRT: () => session && (session.peran === "ketua" || session.peran === "bendahara"),
  editKasJimpitan: () => session && (session.peran === "ketua" || session.peran === "kt_bendahara"),
  editKasGerabah: () => session && (session.peran === "ketua" || session.peran === "bendahara"),
  manageUsers: () => session && session.peran === "admin",
  scanJimpitan: () => session && (session.peran === "kt_petugas" || session.peran === "kt_ketua"),
  isAdmin: () => session && session.peran === "admin",
  isWarga: () => session && session.peran === "warga",
  managePengumuman: () => session && (session.peran === "ketua" || session.peran === "sekretaris"),
  processSurat: () => session && (session.peran === "ketua" || session.peran === "sekretaris"),
  finalizeSurat: () => session && session.peran === "ketua",
  processPengaduan: () => session && (session.peran === "ketua" || session.peran === "sekretaris"),
  manageKT: () => session && (session.peran === "ketua" || session.peran === "kt_ketua"),
  viewKasJimpitan: () => session && (session.peran === "ketua" || session.peran === "kt_ketua" || session.peran === "kt_bendahara"),
  manageKontak: () => session && (session.peran === "ketua" || session.peran === "sekretaris"),
  manageIuranRT: () => session && (session.peran === "ketua" || session.peran === "bendahara"),
  hapusPertemuanRT: () => session && session.peran === "ketua",
  inputJimpitan: () => session && (session.peran === "ketua" || session.peran === "kt_ketua" || session.peran === "kt_petugas"),
  postJimpitan: () => session && (session.peran === "ketua" || session.peran === "kt_bendahara"),
  manageInventaris: () => session && (session.peran === "ketua" || session.peran === "sekretaris"),
  viewRekapJimpitan: () => session && (session.peran === "ketua" || session.peran === "kt_ketua" || session.peran === "kt_bendahara"),
  bayarJimpitan: () => session && (session.peran === "ketua" || session.peran === "kt_bendahara"),
  manageRumah: () => session && (session.peran === "ketua" || session.peran === "sekretaris" || session.peran === "kt_ketua" || session.peran === "kt_bendahara"),
};
// alias supaya kode lama yang memanggil can.editKas() tetap berfungsi (Kas RT)
can.editKas = can.editKasRT;
const ROLE_LABEL = { ketua: "Ketua RT", sekretaris: "Sekretaris RT", bendahara: "Bendahara RT",
  kt_ketua: "Ketua Karang Taruna", kt_bendahara: "Bendahara Karang Taruna", kt_petugas: "Petugas Jimpitan",
  admin: "Admin", warga: "Warga" };

/* ====================== DATA TETAP (belum ada di struktur Sheet spesifikasi) ====================== */
const STATIS = {
  surat_jenis:["Surat Pengantar KTP/KK","Surat Keterangan Domisili","Surat Keterangan Tidak Mampu","Surat Pengantar Nikah","Surat Keterangan Kematian"],
};
function statusBadge(s) {
  s = String(s || "").toLowerCase();
  if (s === "selesai" || s === "lunas") return '<span class="badge ok">' + esc(s.charAt(0).toUpperCase()+s.slice(1)) + '</span>';
  if (s === "diproses") return '<span class="badge wait">Diproses</span>';
  return '<span class="badge due">' + esc(s || "Diajukan") + '</span>';
}
function waLink(text) { return "https://wa.me/?text=" + encodeURIComponent(text); }

/* ====================== STATE APLIKASI ====================== */
let currentTab = "beranda";
let cache = {
  kk: [], kas: { mutasi: [], saldo: 0 }, totalKK: 0, totalJiwa: 0, users: [],
  pengumuman: [], surat: [], pengaduan: [], kt: [], kontak: [],
  kasJimpitan: { mutasi: [], saldo: 0 }, kasGerabah: { mutasi: [], saldo: 0 },
  pertemuan: [], iuran: [], rumah: [], jimpitanLog: [], jimpitanTotalBelum: 0,
  tunggakan: [], tunggakanTotal: 0, inventaris: []
};
let loginMode = "pengurus";
let formError = "";
let kkRowSeq = 0;

function render() {
  const el = document.getElementById("phone");
  el.innerHTML = session ? appShell() : loginScreen();
  attachEvents();
}

/* ====================== LOGIN ====================== */
function loginScreen() {
  return `
    <div class="login-wrap">
      <div class="login-brand">Mas eRTe Mobile</div>
      <div class="login-place">Dukuh Tulusari · RT 11 · Karangwaru, Plupuh</div>
      <div class="tabs2">
        <button data-mode="pengurus" class="${loginMode==='pengurus'?'active':''}">Pengurus &amp; Petugas</button>
        <button data-mode="warga" class="${loginMode==='warga'?'active':''}">Warga</button>
      </div>
      ${formError ? `<div class="err">${esc(formError)}</div>` : ""}
      ${loginMode === "pengurus" ? `
        <div class="field"><label>Username</label><input id="fUsername" autocomplete="username"></div>
        <div class="field"><label>Password</label><input id="fPassword" type="password" autocomplete="current-password"></div>
        <button class="btn block" id="btnLoginPengurus">Masuk</button>
      ` : `
        <div class="field"><label>Nama lengkap (sesuai Data Warga)</label><input id="fNama"></div>
        <div class="field"><label>NIK</label><input id="fNik" inputmode="numeric"></div>
        <button class="btn gold block" id="btnLoginWarga">Masuk sebagai Warga</button>
      `}
    </div>`;
}

/* ====================== SHELL SETELAH LOGIN ====================== */
function appShell() {
  const header = `
    <header>
      <div class="brand">Mas eRTe Mobile</div>
      <div class="place">Dukuh Tulusari · RT 11 · Karangwaru, Plupuh</div>
      <div class="who">
        <div><div class="name">${esc(session.nama)}</div><div class="role">${esc(ROLE_LABEL[session.peran] || session.peran)}</div></div>
        <button class="logout" id="btnLogout">Keluar</button>
      </div>
    </header>`;
  if (can.isAdmin()) {
    // Sesuai spesifikasi: Admin hanya mengelola akun, tidak melihat modul data lain.
    return `${header}
      <main id="screen">Memuat…</main>
      <nav id="navbar">
        <button data-tab="akun" class="active"><span class="ic">🔐</span>Kelola Akun</button>
      </nav>`;
  }
  return `${header}
    <main id="screen">Memuat…</main>
    <nav id="navbar">
      <button data-tab="beranda" class="${currentTab==='beranda'?'active':''}"><span class="ic">🏠</span>Beranda</button>
      <button data-tab="warga" class="${currentTab==='warga'?'active':''}"><span class="ic">👪</span>Warga</button>
      <button data-tab="kas" class="${currentTab==='kas'?'active':''}"><span class="ic">💰</span>Kas</button>
      <button data-tab="info" class="${currentTab==='info'?'active':''}"><span class="ic">📣</span>Info</button>
      <button data-tab="lainnya" class="${['lainnya','surat','pengaduan','kt','kontak','jimpitan','akun','iuranrt','iuranrtDetail','tunggakan','inventaris','rumah','rekapjimpitan','rekapjimpitanDetail','rekapharian'].includes(currentTab)?'active':''}"><span class="ic">☰</span>Lainnya</button>
    </nav>`;
}

function setScreen(html) { const s = document.getElementById("screen"); if (s) s.innerHTML = html; }

/* ====================== NAVIGASI ====================== */
async function goTab(tab) {
  currentTab = tab;
  render();
  await loadAndShow(tab);
}
async function loadAndShow(tab) {
  setScreen('<div class="empty">Memuat…</div>');
  try {
    if (tab === "beranda") { await Promise.all([refreshBeranda(), refreshInfo()]); setScreen(screens.beranda()); }
    else if (tab === "warga") { await refreshWarga(); setScreen(screens.warga()); }
    else if (tab === "kas") { await refreshKas(); setScreen(screens.kas()); }
    else if (tab === "info") { await refreshInfo(); setScreen(screens.info()); }
    else if (tab === "lainnya") setScreen(screens.lainnya());
    else if (tab === "akun") { await refreshUsers(); setScreen(screens.akun()); }
    else if (tab === "surat") { await refreshSurat(); setScreen(screens.surat()); }
    else if (tab === "pengaduan") { await refreshPengaduan(); setScreen(screens.pengaduan()); }
    else if (tab === "kt") { await refreshKT(); setScreen(screens.kt()); }
    else if (tab === "kontak") { await refreshKontak(); setScreen(screens.kontak()); }
    else if (tab === "iuranrt") { await refreshPertemuanRT(); setScreen(screens.iuranrt()); }
    else if (tab === "jimpitan") { await refreshJimpitanLog(); setScreen(screens.jimpitan()); }
    else if (tab === "rekapjimpitan") { await refreshRekapJimpitan(); setScreen(screens.rekapjimpitan()); }
    else if (tab === "rekapjimpitanDetail") { await refreshRekapDetail(); setScreen(screens.rekapjimpitanDetail()); }
    else if (tab === "rekapharian") { await refreshRekapHarian(); setScreen(screens.rekapharian()); }
    else if (tab === "tunggakan") { await refreshTunggakanRT(); setScreen(screens.tunggakan()); }
    else if (tab === "inventaris") { await refreshInventaris(); setScreen(screens.inventaris()); }
    else if (tab === "rumah") { await refreshWarga(); setScreen(screens.rumah()); }
    else if (screens[tab]) setScreen(screens[tab]());
  } catch (err) {
    setScreen(`<div class="err">Gagal memuat data: ${esc(err.message)}</div>`);
  }
  attachEvents();
}
async function refreshBeranda() {
  const [w, k] = await Promise.all([apiGet("getWargaKK"), apiGet("getKas", { jenis_kas: "rt" })]);
  if (w.ok) { cache.totalKK = w.total_kk; cache.totalJiwa = w.total_jiwa; }
  if (k.ok) { cache.kas = k; }
}
async function refreshWarga() {
  const [w] = await Promise.all([apiGet("getWargaKK"), refreshRumah()]);
  if (!w.ok) throw new Error(w.error);
  cache.kk = w.kk; cache.totalKK = w.total_kk; cache.totalJiwa = w.total_jiwa;
}
async function refreshKas() {
  const jobs = [apiGet("getKas", { jenis_kas: "rt" }), apiGet("getKas", { jenis_kas: "gerabah" })];
  const [rt, gerabah] = await Promise.all(jobs);
  if (!rt.ok) throw new Error(rt.error);
  cache.kas = rt;
  if (gerabah.ok) cache.kasGerabah = gerabah;
  if (can.viewKasJimpitan()) {
    const j = await apiGet("getKas", { jenis_kas: "jimpitan" });
    if (j.ok) cache.kasJimpitan = j;
  }
}
async function refreshUsers() {
  const u = await apiGet("getUsers");
  if (!u.ok) throw new Error(u.error);
  cache.users = u.users;
}
async function refreshInfo() {
  const r = await apiGet("getPengumuman");
  if (r.ok) cache.pengumuman = r.pengumuman;
}
async function refreshSurat() {
  const params = can.isWarga() ? { nik: session.nik } : {};
  const r = await apiGet("getSurat", params);
  if (!r.ok) throw new Error(r.error);
  cache.surat = r.surat;
}

  rekapjimpitanDetail(){

      <h2 class="title" style="margin-top:18px; font-size:15px">Rincian harian (petugas &amp; uang diambil)</h2>

          ${(dt.rincian && dt.rincian.length) ? dt.rincian.map(x => `

                ${x.jenis==='pelunasan' ? `<div class="item-sub" style="color:var(--green)">pelunasan${x.tanggal_bayar ? ', dibayar ' + esc(tglPendekApp(x.tanggal_bayar)) : ''}</div>` : ''}</td>

              <td style="padding:8px 10px; text-align:right; font-weight:700; white-space:nowrap">${rupiah(x.jumlah)}</td>

          <div class="item-sub">dibayar ${fmtTanggal(p.tanggal_bayar)} · dicatat ${esc(p.dicatat_oleh||'-')}</div></div>`).join("") : '<div class="empty">Belum ada pelunasan pada bulan ini.</div>'}

  iuranrtDetail(pertemuan){
    const manage = can.manageIuranRT();
    const posted = String(pertemuan.status).toLowerCase() === 'sudah_posting';
    const lunas = cache.iuran.filter(i => String(i.status).toLowerCase() === 'lunas');

      ${posted ? '<div class="badge ok" style="margin-bottom:10px; display:inline-block">Sudah diposting ke Kas RT</div>' : ''}

      return `<span class="badge due">${esc(k)}</span>`;

              ${x.catatan ? `<div class="item-sub">${esc(x.catatan)}</div>` : ''}
              ${manage ? `<div class="btn-row"><button class="btn outline sm" data-edit-inventaris="${esc(x.id)}">Ubah</button><button class="btn brick sm" data-del-inventaris="${esc(x.id)}">Hapus</button></div>` : ''}

      `;

/* ---- Scan KK ---- */
function readAsDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error("Gagal membaca file")); r.readAsDataURL(file); }); }
async function impPreparePayload(file) {
  if (file.type === "application/pdf") {
    if (file.size > 8 * 1024 * 1024) throw new Error("PDF terlalu besar (maks 8 MB).");
    return { mime: "application/pdf", data: (await readAsDataURL(file)).split(",")[1] };
  }
  const url = await readAsDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Gambar tidak bisa dibuka.")); i.src = url; });
  const scale = Math.min(1, 2000 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
  return { mime: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1] };
}
async function impScan(file) {
  imp.err = ""; imp.msg = ""; imp.busy = "Membaca KK… (bisa 10–30 detik, jangan tutup halaman)"; imporRender();
  try {
    const p = await impPreparePayload(file);
    const r = await apiPost("ocrKK", p);
    if (!r.ok) throw new Error(r.error);
    imp.raw = r.text || "";
    const rows = parseKKText(imp.raw);
    if (!rows.length) { imp.err = "Tidak menemukan NIK 16 digit di dokumen. Coba foto yang lebih jelas, atau isi manual lewat \"Tambah baris manual\"."; }
    else { imp.rows = imp.rows.concat(rows); imp.msg = "Hasil baca otomatis bisa keliru — mohon periksa tiap baris (terutama nama dan NIK) sebelum menyimpan."; }
  } catch (e) { imp.err = e.message; }
  imp.busy = ""; imporRender();
}
function parseKKText(text) {
  const lines = String(text || "").replace(/\r/g, "").split("\n").map(l => l.trim()).filter(Boolean);
  const all = String(text || "");
  let kk = "";
  const m = all.match(/No\.?\s*:?\s*(\d{16})/i);
  if (m) kk = m[1];
  const found = []; // {nik, line}
  lines.forEach((l, i) => { (l.match(/\d{16}/g) || []).forEach(n => found.push({ n, i })); });
  if (!kk && found.length) kk = found[0].n;
  const niks = found.filter(f => f.n !== kk);
  const seen = {}; const uniq = niks.filter(f => seen[f.n] ? false : (seen[f.n] = true));
  if (!uniq.length) return [];
  const HEAD = /KARTU|KELUARGA$|NAMA|LENGKAP|\bNIK\b|JENIS|KELAMIN|TEMPAT|LAHIR|TANGGAL|AGAMA|PENDIDIKAN|PEKERJAAN|GOLONGAN|DARAH|STATUS|PERKAWINAN|HUBUNGAN|KEWARGANEGARAAN|DOKUMEN|PASPOR|KITAS|KITAP|ORANG TUA|\bAYAH\b|\bIBU\b|DESA|KELURAHAN|KECAMATAN|KABUPATEN|KOTA|PROVINSI|ALAMAT|DUSUN|KODE POS|\bRT\b|\bRW\b|DIKELUARKAN|KEPALA DINAS|KEPALA KELUARGA|PENCATATAN|SIPIL|HALAMAN|WNI|WNA|ISLAM|KRISTEN|KATOLIK|HINDU|BUDDHA|BUDHA|KONGHUCU|LAKI|PEREMPUAN|KAWIN|CERAI|ISTRI|SUAMI|^ANAK$|MENANTU|CUCU|MERTUA|FAMILI|PELAJAR|MAHASISWA|PETANI|BURUH|WIRASWASTA|KARYAWAN|SWASTA|\bPNS\b|MENGURUS|RUMAH TANGGA|PEDAGANG|DAGANG|NELAYAN|PENSIUN|TNI|POLRI|GURU|TAMAT|SEKOLAH|BELUM|DIPLOMA|SLTA|SLTP|SEDERAJAT|TIDAK|\bSD\b|LAINNYA|SEKRETARIS/;
  const isName = l => /^[A-Za-z .,'\-]{3,}$/.test(l) && l === l.toUpperCase() && !HEAD.test(l.toUpperCase());
  const usedName = {};
  const pickName = (idx, nikStr) => {
    const rest = lines[idx].replace(nikStr, "").replace(/^[\d\s.]+/, "").trim();
    if (isName(rest) && !usedName[rest]) return rest;
    for (let d = 1; d <= 3; d++) for (const j of [idx - d, idx + d]) {
      if (j >= 0 && j < lines.length && isName(lines[j]) && !usedName[lines[j]]) return lines[j];
    }
    return "";
  };
  const SKIP = /NAMA|STATUS|JENIS|TANGGAL|TEMPAT|HUBUNGAN|PERKAWINAN|KEWARGANEGARAAN|:/;
  const seq = (re, N) => { const out = []; lines.forEach(l => { if (SKIP.test(l.toUpperCase())) return; const mm = l.toUpperCase().match(re); if (mm) mm.forEach(x => out.push(x)); }); return out.length >= N ? out.slice(0, N) : null; };
  const N = uniq.length;
  let hub = seq(/\b(?:KEPALA KELUARGA|ISTRI|SUAMI|ANAK|MENANTU|CUCU|ORANG ?TUA|MERTUA|FAMILI LAIN|PEMBANTU)\b/g, N);
  const jk = seq(/LAKI-?\s?LAKI|PEREMPUAN/g, N);
  const dt = seq(/\b\d{2}[-\/]\d{2}[-\/]\d{4}\b/g, N);
  const ag = seq(/ISLAM|KRISTEN|KATOLIK|HINDU|BUDDHA|BUDHA|KONGHUCU/g, N);
  const kw = seq(/\b(?:BELUM KAWIN|KAWIN BELUM TERCATAT|KAWIN TERCATAT|CERAI HIDUP|CERAI MATI|KAWIN)\b/g, N);
  const cap = s => s.toLowerCase().replace(/(^|[\s\-])(\w)/g, (a, b, c) => b + c.toUpperCase());
  return uniq.map((f, k) => {
    const nama = pickName(f.i, f.n); if (nama) usedName[nama] = 1;
    return impBlank({
      no_kk: kk, nik: f.n, nama: nama ? nama.replace(/\s+/g, " ") : "",
      status_hubungan: hub ? cap(hub[k]) : (k === 0 ? "Kepala Keluarga" : ""),
      jenis_kelamin: jk ? (/^LAKI/.test(jk[k]) ? "Laki-laki" : "Perempuan") : "",
      ttl: dt ? dt[k] : "", agama: ag ? cap(ag[k]) : "", status_kawin: kw ? cap(kw[k]) : ""
    });
  });
}

/* ---- CSV ---- */
function csvParse(text) {
  text = text.replace(/^\uFEFF/, "");
  const first = text.split(/\r?\n/, 1)[0] || "";
  const delim = (first.split(";").length > first.split(",").length) ? ";" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ""; }
    else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (ch !== "\r") cur += ch;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
}
const CSV_ALIAS = {
  nokk: "no_kk", nomorkk: "no_kk", kk: "no_kk", nokartukeluarga: "no_kk", nik: "nik", nama: "nama", namalengkap: "nama",
  jeniskelamin: "jenis_kelamin", jk: "jenis_kelamin", gender: "jenis_kelamin", ttl: "ttl", tempatlahir: "ttl", tanggallahir: "ttl", tempattanggallahir: "ttl",
  agama: "agama", pendidikan: "pendidikan", pekerjaan: "pekerjaan", statuskawin: "status_kawin", statusperkawinan: "status_kawin",
  statushubungan: "status_hubungan", hubungan: "status_hubungan", statushubungandalamkeluarga: "status_hubungan",
  namaayah: "nama_ayah", ayah: "nama_ayah", namaibu: "nama_ibu", ibu: "nama_ibu", blok: "blok", norumah: "no_rumah", nomorrumah: "no_rumah"
};
async function impCsv(file) {
  imp.err = ""; imp.msg = ""; imp.busy = "Membaca CSV…"; imporRender();
  try {
    const data = csvParse(await file.text());
    if (data.length < 2) throw new Error("File kosong atau hanya berisi judul kolom.");
    const map = data[0].map(h => CSV_ALIAS[String(h).toLowerCase().replace(/[^a-z0-9]/g, "")] || null);
    if (map.indexOf("nik") === -1 || map.indexOf("nama") === -1 || map.indexOf("no_kk") === -1)
      throw new Error("Judul kolom harus memuat no_kk, nik, dan nama. Unduh template untuk contohnya.");
    const rows = data.slice(1).map(c => { const o = impBlank(); map.forEach((f, i) => { if (f) o[f] = String(c[i] === undefined ? "" : c[i]).trim(); }); return o; });
    if (rows.length > 500) throw new Error("Maksimal 500 baris per impor. Pecah file Anda.");
    imp.rows = imp.rows.concat(rows); imp.msg = rows.length + " baris terbaca dari CSV. Periksa dulu sebelum menyimpan.";
  } catch (e) { imp.err = e.message; }
  imp.busy = ""; imporRender();
}
function impDownloadTemplate() {
  const csv = "\uFEFFno_kk,nik,nama,jenis_kelamin,ttl,agama,pendidikan,pekerjaan,status_kawin,status_hubungan,nama_ayah,nama_ibu,blok,no_rumah\r\n" +
    "3314000000000001,3314000000000002,BUDI SANTOSO,Laki-laki,Sragen 17-08-1985,Islam,SLTA,Petani,Kawin,Kepala Keluarga,,,,\r\n" +
    "3314000000000001,3314000000000003,SITI AMINAH,Perempuan,Sragen 02-03-1988,Islam,SLTA,Mengurus Rumah Tangga,Kawin,Istri,,,,\r\n";
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "template-impor-warga.csv"; a.click();
}

/* ---- Simpan ---- */
async function impSave() {
  const btn = document.getElementById("impSave"); btn.disabled = true; btn.textContent = "Menyimpan…";
  imp.err = "";

  if (!r.ok) { imp.err = r.error; imporRender(); return; }
  const skippedIdx = new Set((r.dilewati || []).map(s => s.baris - 1));
  imp.rows = imp.rows.filter((_, i) => skippedIdx.has(i));
  imp.msg = "✅ " + r.ditambah + " warga berhasil ditambahkan." + (r.dilewati.length ? "\n⚠ " + r.dilewati.length + " baris dilewati (tetap ditampilkan di bawah agar bisa diperbaiki):\n" + r.dilewati.map(s => "• " + s.alasan).join("\n") : "");
  try { await refreshWarga(); } catch (e) {}
  if (!imp.rows.length) { alert(imp.msg); goTab("warga"); return; }
  imporRender();
}

function bindRumahSelect() {

// Ambil id_rumah dari form (fRumahPilih + fRumahBaruNama kalau perlu buat baru dulu).
async function resolveRumahFromForm() {
  const sel = document.getElementById("fRumahPilih");
  if (!sel) return { ok: true, id_rumah: "" };
  if (sel.value === "__baru__") {
    const nama = (document.getElementById("fRumahBaruNama").value || "").trim();
    if (!nama) return { ok: false, error: "Nama rumah baru wajib diisi." };
    const r = await apiPost("addRumah", { nama });
    if (!r.ok) return { ok: false, error: r.error };
    await refreshRumah();
    return { ok: true, id_rumah: r.id };
  }
  return { ok: true, id_rumah: sel.value || "" };
}

// Cari & filter daftar KK di form Rumah, plus hitung berapa yang tercentang.
function bindRumahKkFilter() {
  const input = document.getElementById("fCariKK");
  const countEl = document.getElementById("rumahKkCount");
  const rows = () => Array.from(document.querySelectorAll(".rumah-kk-row"));
  const updateCount = () => { if (countEl) countEl.textContent = document.querySelectorAll(".rumah-kk-check:checked").length + " KK dicentang"; };
  if (input) {
    input.addEventListener("input", () => {
      const term = input.value.trim().toLowerCase();
      let anyVisible = false;
      rows().forEach(row => {
        const match = !term || row.dataset.nama.indexOf(term) > -1;
        row.style.display = match ? "" : "none";
        if (match) anyVisible = true;
      });
      const emptyMsg = document.getElementById("rumahKkEmptyFilter");
      if (emptyMsg) emptyMsg.style.display = (rows().length && !anyVisible) ? "block" : "none";
    });
  }
  document.querySelectorAll(".rumah-kk-check").forEach(c => c.addEventListener("change", updateCount));
}

  const list = r.anggota;
  wrap.innerHTML = list.length ? list.map(a => `

      ${can.editWarga() ? `<div class="btn-row"><button class="btn outline sm" data-edit-anggota="${esc(a.nik)}">Ubah</button><button class="btn brick sm" data-del-anggota="${esc(a.nik)}">Hapus</button></div>` : ""}
    </div>`).join("") : '<div class="empty">Belum ada anggota di KK ini.</div>';
  Array.from(wrap.querySelectorAll("[data-edit-anggota]")).forEach(b => b.addEventListener("click", () => {

  }));
  Array.from(wrap.querySelectorAll("[data-del-anggota]")).forEach(b => b.addEventListener("click", () => delAnggota(no_kk, b.dataset.delAnggota)));
}
async function submitKK() {
  const no_kk = document.getElementById("fNoKK").value.trim();
  const rows = Array.from(document.querySelectorAll(".kk-anggota-row")).map(row => ({
    nama: row.querySelector(".fRowNama").value.trim(),
    nik: row.querySelector(".fRowNik").value.trim(),
    status_hubungan: row.querySelector(".fRowHubungan").value.trim()
  }));
  const first = rows[0] || {};
  const extra = rows.slice(1).filter(a => a.nama || a.nik);
  if (!no_kk) { formError = "No. KK wajib diisi."; setScreen(kkForm()); attachEvents(); return; }
  if (!first.nama || !first.nik) { formError = "Nama dan NIK anggota pertama (Kepala Keluarga) wajib diisi."; setScreen(kkForm()); attachEvents(); return; }
  const invalidExtra = extra.find(a => !a.nama || !a.nik);
  if (invalidExtra) { formError = "Lengkapi Nama dan NIK untuk setiap anggota tambahan, atau hapus barisnya jika tidak dipakai."; setScreen(kkForm()); attachEvents(); return; }
  const rr0 = await resolveRumahFromForm();
  if (!rr0.ok) { formError = rr0.error; setScreen(kkForm()); attachEvents(); return; }

  const btn = document.getElementById("btnSimpanKK"); btn.disabled = true; btn.textContent = "Menyimpan…";
  const r = await apiPost("addAnggota", { no_kk, id_rumah: rr0.id_rumah, nama: first.nama, nik: first.nik, status_hubungan: first.status_hubungan });
  if (!r.ok) { formError = r.error; setScreen(kkForm()); attachEvents(); return; }

  const warnings = [];
  for (const a of extra) {
    const rr = await apiPost("addAnggota", { no_kk, nama: a.nama, nik: a.nik, status_hubungan: a.status_hubungan });
    if (!rr.ok) warnings.push(`${a.nama} (${a.nik}): ${rr.error}`);
  }
  formError = "";
  await refreshWarga();
  openKK(no_kk);
  if (warnings.length) alert("KK tersimpan, tapi ada anggota yang gagal ditambahkan:\n" + warnings.join("\n") + "\nSilakan tambahkan manual lewat tombol \"+ Tambah anggota\" di halaman KK.");
}

/* ---- rekap & tunggakan jimpitan ---- */
function wibToday() { return new Date(Date.now() + 7*3600*1000).toISOString().slice(0,10); }
function bulanLabel(b) {
  const [y, m] = String(b).split("-").map(Number);
  return ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][m-1] + " " + y;
}
let rekapJ = { bulan: wibToday().slice(0,7), data: null, detail: null, detailId: "", onlyTunggak: false };
async function refreshRekapJimpitan() {
  const r = await apiGet("getRekapJimpitan", { bulan: rekapJ.bulan });
  if (!r.ok) throw new Error(r.error);
  rekapJ.data = r;
}
let rekapH = { tanggal: wibToday(), data: null, filter: "semua" };
const BLN_PENDEK = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function tglPendekApp(ymd) { const m = String(ymd || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (parseInt(m[3],10) + " " + BLN_PENDEK[parseInt(m[2],10)-1]) : (ymd || "-"); }
function hariLabel(ymd) {
  const m = String(ymd).match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return ymd;
  const nm = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"][new Date(Date.UTC(+m[1], +m[2]-1, +m[3])).getUTCDay()];
  return nm + ", " + parseInt(m[3],10) + " " + bulanLabel(m[1] + "-" + m[2]);
}
async function refreshRekapHarian() {
  const r = await apiGet("getRekapHarianJimpitan", { tanggal: rekapH.tanggal });
  if (!r.ok) throw new Error(r.error);
  rekapH.data = r;
}
function csvRekapHarian() {
  const d = rekapH.data; if (!d) return;
  const rows = [["tanggal","rumah","petugas","jam","setoran","pelunasan","total_diambil","status"]];
  d.rumah.forEach(o => { if (o.dicatat) rows.push([d.tanggal, o.nama, o.petugas.join(" / "), o.jam, o.setor, o.pelunasan, o.diambil, o.status]); });
  downloadCSV("jimpitan-harian-" + d.tanggal + ".csv", rows);
}
async function refreshRekapDetail() {
  const r = await apiGet("getDetailJimpitanRumah", { id_rumah: rekapJ.detailId, bulan: rekapJ.bulan });
  if (!r.ok) throw new Error(r.error);
  rekapJ.detail = r;
}
function rekapRow(id) {
  if (rekapJ.detail && rekapJ.detail.ringkasan.id === id) return rekapJ.detail.ringkasan;
  return rekapJ.data && rekapJ.data.rumah.find(o => o.id === id);
}
function csvCell(v) { v = String(v == null ? "" : v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function downloadCSV(name, rows) {
  const csv = "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function shareWa(text) { window.open(waLink(text), "_blank"); }
function csvRekapBulan() {
  const d = rekapJ.data;
  const rows = [["rumah","status","hari_wajib","hari_setor","hari_lunas","total_setor","target_bulan","kurang_bulan_ini","tunggakan_bulan_sebelumnya","total_tunggakan"]];
  d.rumah.forEach(o => rows.push([o.nama, o.status_jimpitan, o.hari_wajib, o.hari_setor, o.hari_lunas, o.setor, o.target, o.kurang_bulan, o.tunggakan_lalu, o.total_tunggakan]));
  downloadCSV("rekap-jimpitan-" + rekapJ.bulan + ".csv", rows);
}
function waRekapBulan() {
  const d = rekapJ.data, s = d.ringkasan;
  const men = d.rumah.filter(o => o.total_tunggakan > 0);
  let t = `*Rekap Jimpitan ${bulanLabel(rekapJ.bulan)}*\nRT 11 Dukuh Tulusari\n(dihitung s/d ${fmtTanggal(d.dihitung_sampai)})\n\nTerkumpul: ${rupiah(s.terkumpul)}\nTotal tunggakan: ${rupiah(s.tunggakan)} (${s.rumah_menunggak} rumah)\n`;
  if (men.length) { t += "\nRumah yang menunggak:\n"; men.forEach((o, i) => { t += `${i+1}. ${o.nama} — ${rupiah(o.total_tunggakan)} (${o.hari_tunggak} hari)\n`; }); }
  else t += "\nSemua rumah lunas. Terima kasih 🙏";
  shareWa(t);
}
function waRumah(id) {
  const o = rekapRow(id); if (!o) return;
  shareWa(`Assalamualaikum, pengingat jimpitan RT 11 Dukuh Tulusari.\nRumah: ${o.nama}\nTunggakan s/d ${bulanLabel(rekapJ.bulan)}: ${rupiah(o.total_tunggakan)} (${o.hari_tunggak} hari x Rp500).\nMohon dilunasi lewat petugas/Bendahara Karang Taruna. Terima kasih 🙏`);
}
function csvDetailRumah() {
  const dt = rekapJ.detail, o = dt.ringkasan;
  const rows = [["rumah","tanggal","setor","status"]];
  dt.hari.forEach(h => rows.push([o.nama, h.tanggal, h.paid, h.status]));
  downloadCSV("jimpitan-" + o.nama.replace(/[^\w]+/g, "-") + "-" + rekapJ.bulan + ".csv", rows);
}
async function lunasiJimpitan(id) {
  const o = rekapRow(id); if (!o) return;
  const v = prompt(`${o.nama} menunggak ${o.hari_tunggak} hari (${rupiah(o.total_tunggakan)}) s/d ${bulanLabel(rekapJ.bulan)}.\nDilunasi mulai hari terlama. Berapa hari yang dilunasi? (1–${o.hari_tunggak})`, String(o.hari_tunggak));
  if (v === null) return;
  const n = parseInt(v, 10);
  if (!n || n < 1 || n > o.hari_tunggak) { alert("Jumlah hari tidak valid."); return; }
  const r = await apiPost("bayarJimpitan", { id_rumah: id, bulan: rekapJ.bulan, jumlah_hari: n });
  if (!r.ok) { alert(r.error); return; }
  alert(r.message);
  await loadAndShow(currentTab);
}
function bindRekapJimpitan() {
  const q = sel => document.querySelector(sel);
  const qa = sel => Array.from(document.querySelectorAll(sel));
  qa("[data-rekap-geser]").forEach(b => b.addEventListener("click", () => {
    const [y, m] = rekapJ.bulan.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1 + Number(b.dataset.rekapGeser), 1));
    rekapJ.bulan = dt.toISOString().slice(0, 7); loadAndShow("rekapjimpitan");
  }));
  q("#rekapBulan") && q("#rekapBulan").addEventListener("change", e => { if (e.target.value) { rekapJ.bulan = e.target.value; loadAndShow("rekapjimpitan"); } });
  q("#rekapOnlyTunggak") && q("#rekapOnlyTunggak").addEventListener("change", e => { rekapJ.onlyTunggak = e.target.checked; setScreen(screens.rekapjimpitan()); attachEvents(); });
  q("#btnRekapCsv") && q("#btnRekapCsv").addEventListener("click", csvRekapBulan);
  q("#btnRekapHarian") && q("#btnRekapHarian").addEventListener("click", () => { rekapH.tanggal = wibToday(); goTab("rekapharian"); });
  qa("[data-harian-geser]").forEach(b => b.addEventListener("click", () => {
    const [y, m, dd] = rekapH.tanggal.split("-").map(Number);
    rekapH.tanggal = new Date(Date.UTC(y, m - 1, dd + Number(b.dataset.harianGeser))).toISOString().slice(0, 10); loadAndShow("rekapharian");
  }));
  q("#rekapHariTgl") && q("#rekapHariTgl").addEventListener("change", e => { if (e.target.value) { rekapH.tanggal = e.target.value; loadAndShow("rekapharian"); } });
  qa("[data-harian-filter]").forEach(b => b.addEventListener("click", () => { rekapH.filter = b.dataset.harianFilter; setScreen(screens.rekapharian()); attachEvents(); }));
  q("#btnHarianCsv") && q("#btnHarianCsv").addEventListener("click", csvRekapHarian);
  q("#btnRekapWa") && q("#btnRekapWa").addEventListener("click", waRekapBulan);
  q("#btnDetailCsv") && q("#btnDetailCsv").addEventListener("click", csvDetailRumah);
  qa("[data-rekap-detail]").forEach(b => b.addEventListener("click", () => { rekapJ.detailId = b.dataset.rekapDetail; goTab("rekapjimpitanDetail"); }));
  qa("[data-lunasi-jimpitan]").forEach(b => b.addEventListener("click", () => lunasiJimpitan(b.dataset.lunasiJimpitan)));
  qa("[data-wa-rumah]").forEach(b => b.addEventListener("click", () => waRumah(b.dataset.waRumah)));
  q("#btnSimpanMulai") && q("#btnSimpanMulai").addEventListener("click", async () => {
    const tanggal = q("#rekapMulai").value;
    if (!tanggal) { alert("Pilih tanggal mulai."); return; }
    if (!confirm("Ubah tanggal mulai tunggakan jimpitan ke " + fmtTanggal(tanggal) + "? Semua rekap dihitung ulang.")) return;
    const r = await apiPost("setJimpitanMulai", { tanggal });
    if (!r.ok) { alert(r.error); return; }
    alert(r.message); loadAndShow("rekapjimpitan");
  });
}

  const btn = document.getElementById("btnSimpanJimpitan");

  if (!selVal) { formError = "Rumah wajib dipilih."; setScreen(jimpitanForm()); attachEvents(); return; }

  if (!rr.ok) { formError = rr.error; setScreen(jimpitanForm()); attachEvents(); return; }
  if (!rr.id_rumah) { formError = "Rumah wajib dipilih."; setScreen(jimpitanForm()); attachEvents(); return; }

async function postingJimpitan() {
  const ids = Array.from(document.querySelectorAll(".jimpitan-check:checked")).map(c => c.value);
  if (!ids.length) { alert("Pilih minimal satu log jimpitan untuk diposting."); return; }
  if (!confirm("Posting " + ids.length + " log terpilih sebagai 1 mutasi masuk ke Kas Jimpitan? Setelah diposting, log ini tidak bisa diubah/dihapus lagi.")) return;
  const r = await apiPost("postJimpitanLog", { ids });
  if (!r.ok) { alert(r.error); return; }
  await refreshJimpitanLog(); setScreen(screens.jimpitan()); attachEvents();
  alert(r.message);
}
